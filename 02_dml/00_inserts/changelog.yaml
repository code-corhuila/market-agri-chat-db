# Seeds only for dev and qa (context dev,qa; gestion D-20): main starts without demo data.
databaseChangeLog:
- changeSet:
    id: 001-seed-checkout-conversation
    author: elkin
    context: dev,qa
    comment: 'The conversation the checkout E2E flows (4, 5 and 6) buy from: the seed buyer Carlos Pérez and the
      producer Ana Ruiz about the seed product Mora de Castilla, with PLATFORM agreed. Same id and data the WireMock
      stub answered, so the flows keep working with the real chat-api.'
    changes:
    - insertOne:
        collectionName: conversation
        document: |
          {
            "_id": "7e0b1d2c-3a4f-4b5c-8d6e-9f0a1b2c3d4e",
            "productId": "5e1f0c2a-7b3d-4e8f-9a6b-000000000021",
            "productName": "Mora de Castilla",
            "buyerId": "6a1d9b2c-3e4f-4a5b-8c6d-7e8f9a0b1c2d",
            "buyerName": "Carlos Pérez",
            "producerId": "0b6f2c7e-4a51-4c1e-9d0e-2f1c3a7b9e10",
            "producerName": "Ana Ruiz",
            "agreedPurchaseMethod": "PLATFORM",
            "lastMessageAt": null,
            "createdAt": {"$date": "2026-11-01T12:00:00Z"}
          }
    rollback:
    - runCommand:
        command: |
          {
            "delete": "conversation",
            "deletes": [{"q": {"_id": "7e0b1d2c-3a4f-4b5c-8d6e-9f0a1b2c3d4e"}, "limit": 1}]
          }
